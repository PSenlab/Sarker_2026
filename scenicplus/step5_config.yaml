#!/usr/bin/env python3
"""
SCENIC+ Step 5: generate one config.yaml per compartment
=========================================================
SCENIC+ is a Snakemake pipeline that reads a single config.yaml, so each
compartment needs its own. This writes them from one template + the shared
compartment registry, so paths cannot drift between runs.

Consumes (per compartment, from Step 4):
  <out_dir>/scenicplus_input/<suffix>_cisTopic_obj.pkl
  <out_dir>/scenicplus_input/<suffix>_GEX_anndata.h5ad
  <out_dir>/scenicplus_input/region_sets/

Writes:
  <out_dir>/scenicplus/config.yaml
  <out_dir>/scenicplus/outs/          (all SCENIC+ outputs land here)
  <out_dir>/scenicplus/tmp/           (per-compartment temp; see note below)

Usage:
  python step5_make_scenicplus_configs.py
  python step5_make_scenicplus_configs.py --run T_ILC myeloid
  python step5_make_scenicplus_configs.py --check      # verify inputs exist
  python step5_make_scenicplus_configs.py --n-cpu 32

"""

import argparse
import os
from string import Template


# =============================================================================
# SHARED RESOURCES  (identical for every compartment -- edit these)
# =============================================================================

# cisTarget / DEM motif databases (mm10 SCREEN v10 clustered)
# Download from https://resources.aertslab.org/cistarget/databases/
CTX_DB = "/data/sarkern2/scenicplus1/databases/mm10_screen_v10_clust.regions_vs_motifs.rankings.feather"
DEM_DB = "/data/sarkern2/scenicplus1/databases/mm10_screen_v10_clust.regions_vs_motifs.scores.feather"
MOTIF_ANNOTATIONS = "/data/sarkern2/scenicplus1/databases/motifs-v10nr_clust-nr.mgi-m0.001-o0.0.tbl"

# Base directory holding the outs_* trees (Steps 1-4). "." if you run in place.
BASE_DIR = "."

N_CPU = 20
SEED = 666


# =============================================================================
# COMPARTMENT REGISTRY  (out_dir / suffix must match Steps 1-4)
# =============================================================================

COMPARTMENTS = {
    "all_celltypes":        dict(out_dir="outs_all_celltypes",        suffix="all_celltypes"),
    "Hepatocyte":           dict(out_dir="outs_Heps",                 suffix="Heps"),
    "endothelial_Kupffer02": dict(out_dir="outs_endothelial_Kupffer02", suffix="endothelial_Kupffer02"),
    "myeloid":              dict(out_dir="outs_myeloid",              suffix="myeloid"),
    "T_ILC":                dict(out_dir="outs_T_ILC",                suffix="T_ILC"),
}


# =============================================================================
# CONFIG TEMPLATE
#   string.Template ($placeholder) is used rather than .format() because the
#   bc_transform_func value contains literal braces -- f'{x}' -- which .format()
#   would try to substitute.
# =============================================================================

CONFIG_TEMPLATE = Template("""# ==============================================================================
# SCENIC+ Step 5 Configuration -- compartment: $name
# GENERATED by step5_make_scenicplus_configs.py -- do not hand-edit.
# Edit the generator and regenerate, so all compartments stay in sync.
# Reference: Sarker et al. (2026) Cell Metabolism
# ==============================================================================
input_data:
  # Outputs of step4_rna_atac_prep_all.py
  cisTopic_obj_fname:       "$cistopic_obj"
  GEX_anndata_fname:        "$gex_anndata"
  region_set_folder:        "$region_sets"
  # cisTarget / DEM motif databases (mm10 SCREEN v10 clustered)
  ctx_db_fname:             "$ctx_db"
  dem_db_fname:             "$dem_db"
  path_to_motif_annotations: "$motif_annotations"
output_data:
  combined_GEX_ACC_mudata: "$outs/ACC_GEX.h5mu"
  dem_result_fname:        "$outs/dem_results.hdf5"
  ctx_result_fname:        "$outs/ctx_results.hdf5"
  output_fname_dem_html:   "$outs/dem_results.html"
  output_fname_ctx_html:   "$outs/ctx_results.html"
  cistromes_direct:        "$outs/cistromes_direct.h5ad"
  cistromes_extended:      "$outs/cistromes_extended.h5ad"
  tf_names:                "$outs/tf_names.txt"
  genome_annotation:       "$outs/genome_annotation.tsv"
  chromsizes:              "$outs/chromsizes.tsv"
  search_space:            "$outs/search_space.tsv"
  tf_to_gene_adjacencies:     "$outs/tf_to_gene_adj.tsv"
  region_to_gene_adjacencies: "$outs/region_to_gene_adj.tsv"
  eRegulons_direct:        "$outs/eRegulon_direct.tsv"
  eRegulons_extended:      "$outs/eRegulons_extended.tsv"
  AUCell_direct:           "$outs/AUCell_direct.h5mu"
  AUCell_extended:         "$outs/AUCell_extended.h5mu"
  scplus_mdata:            "$outs/scplusmdata.h5mu"
params_general:
  temp_dir: "$tmp"
  n_cpu:    $n_cpu
  seed:     $seed
params_data_preparation:
  # identity transform: Step 4 already aligned RNA and ATAC barcodes
  bc_transform_func:       "\\"lambda x: f'{x}'\\""
  is_multiome:             True
  key_to_group_by:         ""
  nr_cells_per_metacells:  10
  direct_annotation:       "Direct_annot"
  extended_annotation:     "Orthology_annot"
  species:                 "mmusculus"
  biomart_host:            "http://www.ensembl.org"
  search_space_upstream:   "1000 150000"
  search_space_downstream: "1000 150000"
  search_space_extend_tss: "10 10"
params_motif_enrichment:
  species:                          "mus_musculus"
  annotation_version:               "v10nr_clust"
  motif_similarity_fdr:             0.001
  orthologous_identity_threshold:   0.0
  annotations_to_use:               "Direct_annot Orthology_annot"
  fraction_overlap_w_dem_database:  0.4
  dem_max_bg_regions:               500
  dem_balance_number_of_promoters:  True
  dem_promoter_space:               1000
  dem_adj_pval_thr:                 0.05
  dem_log2fc_thr:                   1.0
  dem_mean_fg_thr:                  0.0
  dem_motif_hit_thr:                3.0
  fraction_overlap_w_ctx_database:  0.4
  ctx_auc_threshold:                0.005
  ctx_nes_threshold:                3.0
  ctx_rank_threshold:               0.05
params_inference:
  tf_to_gene_importance_method:       "GBM"
  region_to_gene_importance_method:   "GBM"
  region_to_gene_correlation_method:  "SR"
  order_regions_to_genes_by:          "importance"
  order_TFs_to_genes_by:              "importance"
  gsea_n_perm:                        1000
  quantile_thresholds_region_to_gene: "0.85 0.90 0.95"
  top_n_regionTogenes_per_gene:       "5 10 15"
  top_n_regionTogenes_per_region:     ""
  min_regions_per_gene:               0
  rho_threshold:                      0.05
  min_target_genes:                   $min_target_genes
""")


# =============================================================================
# GENERATION
# =============================================================================

def build_config(name, spec, n_cpu, seed, min_target_genes, base_dir):
    out_dir = os.path.abspath(os.path.join(base_dir, spec["out_dir"]))
    suffix = spec["suffix"]
    sp_dir = os.path.join(out_dir, "scenicplus")
    inputs = os.path.join(out_dir, "scenicplus_input")

    paths = dict(
        name=name,
        cistopic_obj=os.path.join(inputs, f"{suffix}_cisTopic_obj.pkl"),
        gex_anndata=os.path.join(inputs, f"{suffix}_GEX_anndata.h5ad"),
        region_sets=os.path.join(inputs, "region_sets"),
        ctx_db=CTX_DB,
        dem_db=DEM_DB,
        motif_annotations=MOTIF_ANNOTATIONS,
        outs=os.path.join(sp_dir, "outs"),
        tmp=os.path.join(sp_dir, "tmp"),
        n_cpu=n_cpu,
        seed=seed,
        min_target_genes=min_target_genes,
    )
    return sp_dir, paths, CONFIG_TEMPLATE.substitute(paths)


def check_inputs(paths):
    """Report any missing input. Databases are shared; inputs are per-run."""
    missing = []
    for label, key in [("cisTopic object", "cistopic_obj"),
                       ("GEX AnnData", "gex_anndata"),
                       ("region sets", "region_sets"),
                       ("ctx database", "ctx_db"),
                       ("dem database", "dem_db"),
                       ("motif annotations", "motif_annotations")]:
        p = paths[key]
        if not os.path.exists(p):
            missing.append((label, p))
    return missing


def count_region_sets(region_sets_dir):
    if not os.path.isdir(region_sets_dir):
        return None
    total = 0
    detail = []
    for sub in sorted(os.listdir(region_sets_dir)):
        d = os.path.join(region_sets_dir, sub)
        if os.path.isdir(d):
            n = len([f for f in os.listdir(d) if f.endswith(".bed")])
            detail.append(f"{sub}:{n}")
            total += n
    return total, detail


def main():
    p = argparse.ArgumentParser(
        description="Generate per-compartment SCENIC+ config.yaml files")
    p.add_argument("--run", nargs="+", default=None, choices=sorted(COMPARTMENTS),
                   help="Which compartments (default: all)")
    p.add_argument("--base-dir", default=BASE_DIR,
                   help="Directory containing the outs_* trees")
    p.add_argument("--n-cpu", type=int, default=N_CPU)
    p.add_argument("--seed", type=int, default=SEED)
    p.add_argument("--min-target-genes", type=int, default=10,
                   help="eRegulon minimum target genes")
    p.add_argument("--check", action="store_true",
                   help="Only verify inputs exist; write nothing")
    args = p.parse_args()

    names = args.run or list(COMPARTMENTS)
    print("=" * 70)
    print("SCENIC+ Step 5: config generation")
    print(f"Compartments: {names}")
    print("=" * 70)

    written = []
    for name in names:
        sp_dir, paths, text = build_config(
            name, COMPARTMENTS[name], args.n_cpu, args.seed,
            args.min_target_genes, args.base_dir)

        print(f"\n--- {name} ---")
        missing = check_inputs(paths)
        if missing:
            for label, path in missing:
                print(f"  [MISSING] {label}: {path}")
        else:
            print("  [OK] all inputs present")

        rs = count_region_sets(paths["region_sets"])
        if rs:
            total, detail = rs
            print(f"  region sets: {total} BED files ({', '.join(detail)})")
            if total == 0:
                print("  [WARN] no BED files -- SCENIC+ motif enrichment will "
                      "have nothing to run on")

        if args.check:
            continue

        os.makedirs(os.path.join(sp_dir, "outs"), exist_ok=True)
        os.makedirs(os.path.join(sp_dir, "tmp"), exist_ok=True)
        cfg_path = os.path.join(sp_dir, "config.yaml")
        with open(cfg_path, "w") as f:
            f.write(text)
        print(f"  [OK] wrote {cfg_path}")
        written.append((name, sp_dir, cfg_path))

    if args.check:
        print("\n[CHECK] no files written.")
        return

    print("\n" + "=" * 70)
    print("CONFIGS WRITTEN -- run each compartment with:")
    for name, sp_dir, cfg_path in written:
        print(f"\n  # {name}")
        print(f"  scenicplus init_snakemake --out_dir {sp_dir}")
        print(f"  #   (then copy {os.path.basename(cfg_path)} over the generated "
              f"config, or point snakemake at it)")
        print(f"  snakemake --cores {args.n_cpu} --configfile {cfg_path}")
    print("=" * 70)


if __name__ == "__main__":
    main()
